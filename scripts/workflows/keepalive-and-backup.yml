name: 🌸 Sakura Keepalive & Cloud Backup

on:
  schedule:
    # 每 6 小時自動執行一次（解決 ntfy 12 小時過期問題，永久雲端保活與備份）
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動一鍵觸發

jobs:
  keepalive-and-backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Keepalive & Backup Script
        run: python scripts/keepalive-backup.py

      - name: Commit & Push Backup (if changed)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/backup-latest.json || true
          if git diff --staged --quiet; then
            echo "No backup changes to commit."
          else
            git commit -m "chore(backup): auto-save sakura study planner snapshot [skip ci]"
            git push origin main
          fi
